name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      # DOM-less unit tests across apps/* and packages/*. Deliberately does not
      # build the wasm crates: nothing under test imports them, so this job
      # stays fast and independent of the Rust toolchain.
      - name: Test
        run: bun test

      # oxlint exits 0 on warnings and non-zero on errors, so this gates new
      # errors without first demanding a cleanup of the warnings already in the
      # tree.
      - name: Lint
        run: bunx oxlint
