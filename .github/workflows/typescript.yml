name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      # bun:test across the workspace: the browser host's conformance suites
      # (effects sink, flow-update dispatcher, midi performer) plus the
      # collab/db packages. None of them import the wasm bindings, so this
      # job needs no Rust toolchain and stays fast.
      - name: Test
        run: bun test

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin a modern wasm-pack: the action's `latest` resolves to a stale
          # v0.9.1 whose bundled wasm-opt can't parse current wasm-bindgen output
          # ("Fatal: error in parsing input"). v0.15.x ships a working wasm-opt
          # and the `--profile` flag `build:wasm` uses to select `wasm-release`.
          version: 'v0.15.0'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: bun install

      # tsc resolves `src/lib/{codegen,firmata,runtime}/generated/*.d.ts`, which
      # are gitignored wasm-pack output. Without them the typecheck fails with
      # TS2307 on all three, so the bindings must be built first.
      - name: Build wasm bindings
        working-directory: apps/web
        run: bun run build:wasm

      - name: Check types
        run: bun run check-types
