name: Smoke

# Browser smoke suite (apps/web/e2e/*.smoke.ts): the built web app, served by
# `vite preview`, driven over CDP. No server or database, local flows only.
# Too slow for every pull request, so it runs nightly, on demand, and as part
# of the release gate.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # release.yml calls this workflow as its gate, so a tag cannot publish
  # code that fails it.
  workflow_call:

permissions:
  contents: read

env:
  # The browser engine the suite attaches to. Obscura ships a Linux build, so
  # CI drives the same engine as local runs, and Playwright never downloads or
  # launches a browser of its own. The checksum pins the exact release asset.
  OBSCURA_VERSION: v0.2.6
  OBSCURA_SHA256: eed986e478c5ec5439f531f2d7fb6b0e36a356f1df7a6c44a8e8fd4f2486bd76
  SMOKE_CDP_URL: http://127.0.0.1:9222

jobs:
  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # The Playwright runner runs on Node (its CDP client does not work on
      # Bun's WebSocket); it needs Node >= 20.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Same pin as typescript.yml: the action's `latest` resolves to a
          # stale wasm-pack whose wasm-opt cannot parse current output.
          version: 'v0.15.0'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install dependencies
        run: bun install

      # The suite needs no server: the app is built against an address where
      # nothing listens, and the suite blocks every other origin anyway.
      - name: Build web app
        working-directory: apps/web
        env:
          VITE_SERVER_URL: http://127.0.0.1:3999
        run: bun run build

      - name: Install Obscura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="$RUNNER_TEMP/obscura"
          mkdir -p "$DIR"
          gh release download "$OBSCURA_VERSION" --repo h4ckf0r0day/obscura \
            --pattern obscura-x86_64-linux.tar.gz --dir "$DIR"
          echo "$OBSCURA_SHA256  $DIR/obscura-x86_64-linux.tar.gz" | sha256sum --check -
          tar -xzf "$DIR/obscura-x86_64-linux.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"

      # --allow-private-network: Obscura blocks loopback by default, and the
      # app under test is on 127.0.0.1.
      - name: Start Obscura
        run: |
          READY="$RUNNER_TEMP/obscura.ready"
          nohup obscura serve --port 9222 --allow-private-network --ready-file "$READY" \
            > "$RUNNER_TEMP/obscura.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -s "$READY" ] && { echo "Obscura listening on $(cat "$READY")"; exit 0; }
            sleep 1
          done
          echo "::error::Obscura did not start within 30s"
          cat "$RUNNER_TEMP/obscura.log"
          exit 1

      - name: Run smoke suite
        working-directory: apps/web
        run: bun run smoke

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            apps/web/test-results/
            ${{ runner.temp }}/obscura.log
          if-no-files-found: ignore
          retention-days: 7
