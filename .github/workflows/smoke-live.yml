name: Smoke (live)

# Post-rollout smoke suite (`bun run smoke:live` in apps/web): the `@live`
# browser flows and the read-only server checks, against the deployed site.
# Run it by hand after a deploy; the daily run catches a broken production
# between deploys.
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Web app URL
        default: https://microflow.tech
      server_url:
        description: Server URL
        default: https://server.microflow.tech
      docs_url:
        description: Docs URL
        default: https://docs.microflow.tech

permissions:
  contents: read

env:
  # Same engine and pin as smoke.yml.
  OBSCURA_VERSION: v0.2.6
  OBSCURA_SHA256: eed986e478c5ec5439f531f2d7fb6b0e36a356f1df7a6c44a8e8fd4f2486bd76
  SMOKE_CDP_URL: http://127.0.0.1:9222
  SMOKE_BASE_URL: ${{ inputs.base_url || 'https://microflow.tech' }}
  SMOKE_SERVER_URL: ${{ inputs.server_url || 'https://server.microflow.tech' }}
  SMOKE_DOCS_URL: ${{ inputs.docs_url || 'https://docs.microflow.tech' }}
  # Lets the runner past Cloudflare's bot challenge (e2e/bypass.ts).
  SMOKE_BYPASS_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

jobs:
  smoke-live:
    name: Live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # The Playwright runner runs on Node (its CDP client does not work on
      # Bun's WebSocket).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Install Obscura
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="$RUNNER_TEMP/obscura"
          mkdir -p "$DIR"
          gh release download "$OBSCURA_VERSION" --repo h4ckf0r0day/obscura \
            --pattern obscura-x86_64-linux.tar.gz --dir "$DIR"
          echo "$OBSCURA_SHA256  $DIR/obscura-x86_64-linux.tar.gz" | sha256sum --check -
          tar -xzf "$DIR/obscura-x86_64-linux.tar.gz" -C "$DIR"
          echo "$DIR" >> "$GITHUB_PATH"

      # Public URLs only: no --allow-private-network.
      - name: Start Obscura
        run: |
          READY="$RUNNER_TEMP/obscura.ready"
          nohup obscura serve --port 9222 --ready-file "$READY" \
            > "$RUNNER_TEMP/obscura.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -s "$READY" ] && { echo "Obscura listening on $(cat "$READY")"; exit 0; }
            sleep 1
          done
          echo "::error::Obscura did not start within 30s"
          cat "$RUNNER_TEMP/obscura.log"
          exit 1

      - name: Run live smoke suite
        working-directory: apps/web
        run: bun run smoke:live

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-live-results
          path: |
            apps/web/test-results/
            ${{ runner.temp }}/obscura.log
          if-no-files-found: ignore
          retention-days: 7
